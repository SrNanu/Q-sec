name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:

  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          pytest tests/ -v


  style-test:
    needs: unit-tests
    name: Verificación de Estilo (Flake8)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install Flake8
        run: pip install flake8

      # F821 (nombre no definido) ya no se ignora: escondia errores reales, como
      # la referencia a user.created_at cuando el modelo no tenia ese campo.
      - name: Test Style
        run: flake8 . --count --exclude=.git,__pycache__,venv,.venv --max-complexity=10 --max-line-length=130 --ignore=E266,F401,E402,W293,E303,C901 --statistics --show-source