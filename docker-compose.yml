services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: qsec:latest
    container_name: qsec-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - FLASK_ENV=production
      - SECRET_KEY=qsec-production-super-secret-key-change-me
      - DATABASE_URL=sqlite:////app/instance/qsec.db
      - WORKERS=2
      - THREADS=4
    volumes:
      - qsec_data:/app/instance

volumes:
  qsec_data:
    driver: local
